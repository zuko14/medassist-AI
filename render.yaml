services:
  - type: web
    name: mediassist-ai
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

  - type: worker
    name: mediassist-connector-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m connectors.runner --all
    autoDeploy: true
