services:
  - type: web
    name: mediassist-ai
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    numInstances: 2
    preDeployCommand: python scripts/migrate.py

  # NOTE: Connector polling is now embedded in the main web process scheduler
  # (app/services/scheduler.py → connector_polling job). No separate worker needed.
  # The standalone worker definition is kept commented for reference / rollback.
  # - type: worker
  #   name: mediassist-connector-worker
  #   env: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: python -m connectors.runner --all
  #   autoDeploy: true

  # Staging environment (W6.5)
  - type: web
    name: mediassist-ai-staging
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    branch: staging
    numInstances: 1
    preDeployCommand: python scripts/migrate.py
