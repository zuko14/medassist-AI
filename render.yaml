services:
  - type: web
    name: mediassist-ai
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    numInstances: 2
    preDeployCommand: python scripts/migrate.py

  - type: worker
    name: mediassist-connector-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m connectors.runner --all
    autoDeploy: true

  # Staging environment (W6.5)
  - type: web
    name: mediassist-ai-staging
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    branch: staging
    numInstances: 1
    preDeployCommand: python scripts/migrate.py
