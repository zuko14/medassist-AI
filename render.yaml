services:
  - type: web
    name: mediassist-ai
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # KA-P0-B: was false. A push then did NOT deploy, so "I fixed it" and
    # "it is live" were different facts, and the web service could sit on a
    # different commit than the connector worker indefinitely. Both main-branch
    # services now auto-deploy together, so they can never diverge.
    # Consequence: every push to main is a production release. Work on a
    # branch and merge deliberately.
    autoDeploy: true
    numInstances: 2
    preDeployCommand: python scripts/migrate.py
    envVars:
      # Connector polling is isolated in the dedicated worker process below.
      # Setting RUN_CONNECTORS_IN_WEB to false ensures Playwright/Chromium does not run
      # inside the web container that must acknowledge Meta webhooks within 20s.
      - key: RUN_CONNECTORS_IN_WEB
        value: "false"

  # Dedicated Background Worker for Integration Connectors (MocDoc/Playwright)
  # Completely isolates browser memory profile and scraping CPU from webhook handling.
  - type: worker
    name: mediassist-connector-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m connectors.runner --all
    # KA-P0-B: must match the web service. A worker pinned on an older commit
    # runs stale connector code against a schema the web service already
    # migrated. It has no preDeployCommand of its own, so on a migrating
    # deploy it may error for a poll cycle or two until the web service's
    # preDeploy migration lands; run_all_connectors retries every minute.
    autoDeploy: true
    envVars:
      - key: MEDASSIST_URL
        value: "http://mediassist-ai:8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/app/.playwright"
      - key: TZ
        value: "Asia/Kolkata"

  # Staging environment (W6.5)
  - type: web
    name: mediassist-ai-staging
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    branch: staging
    numInstances: 1
    preDeployCommand: python scripts/migrate.py
