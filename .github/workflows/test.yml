name: MediAssist AI — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    env:
      # Dummy values for CI — no real connections needed for unit tests
      WHATSAPP_TOKEN: "ci_test_token"
      WHATSAPP_PHONE_NUMBER_ID: "000000000000"
      WHATSAPP_VERIFY_TOKEN: "ci_verify_token"
      GROQ_API_KEY: "ci_groq_key"
      SUPABASE_URL: "https://ci-test.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "ci_service_role_key"
      APP_ENV: "testing"
      META_APP_SECRET: ""
      META_VERIFY_TOKEN: "ci_verify_token"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "ci_admin_password"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Test summary
        if: always()
        run: |
          echo "✅ MediAssist AI test suite completed"
          echo "Python version: $(python --version)"
          echo "Pytest version: $(python -m pytest --version)"
